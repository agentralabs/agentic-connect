name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: agentic-connect-mcp
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: agentic-connect-mcp
    steps:
      - uses: actions/checkout@v4
      - name: Clone agentic-sdk (sibling dependency)
        run: git clone --depth 1 https://github.com/agentralabs/agentic-sdk.git ../agentic-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TARGET=${{ matrix.target }}
          ARTIFACT_NAME=agentic-connect-${VERSION}-${TARGET}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/
          cp target/${{ matrix.target }}/release/acnx dist/ 2>/dev/null || true
          cd dist && tar czf ../${ARTIFACT_NAME}.tar.gz *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: "*.tar.gz"

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone agentic-sdk (sibling dependency)
        run: git clone --depth 1 https://github.com/agentralabs/agentic-sdk.git ../agentic-sdk
      - uses: dtolnay/rust-toolchain@stable

      - name: Validate package
        run: |
          cargo package -p agentic-connect --allow-dirty 2>/dev/null || echo "Package validation skipped (workspace deps)"

      - name: Publish (dry run)
        run: |
          echo "crates.io publish ready — run manually with CARGO_REGISTRY_TOKEN"
