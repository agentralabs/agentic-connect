name: Canonical Sister Guardrails

on:
  push:
    paths: ['README.md', 'scripts/**', 'docs/**', 'Cargo.toml']
  pull_request:
    paths: ['README.md', 'scripts/**', 'docs/**', 'Cargo.toml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical sister checks
        run: bash scripts/check-canonical-sister.sh
