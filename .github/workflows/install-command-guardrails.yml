name: Install Command Guardrails

on:
  push:
    paths: ['scripts/install.sh', 'README.md']
  pull_request:
    paths: ['scripts/install.sh', 'README.md']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install command checks
        run: bash scripts/check-install-commands.sh
