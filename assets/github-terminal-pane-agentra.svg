<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-label="AgenticConnect terminal pane in Agentra design system">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c9c6bb"/>
    </pattern>
    <style><![CDATA[
      .mono { font-family:'IBM Plex Mono','JetBrains Mono',monospace; }
      .ink { fill:#121212; }
      .muted { fill:#6d6a63; }
      .accent { fill:#ea580c; }
    ]]></style>
  </defs>

  <rect width="1400" height="420" fill="#f2f1ea"/>
  <rect width="1400" height="420" fill="url(#grid)"/>

  <line x1="24" y1="34" x2="1376" y2="34" stroke="#1f1f1f"/>
  <text x="24" y="25" class="mono muted" font-size="12" letter-spacing="2">// SECTION: RAW_CONNECT_STREAM</text>
  <text x="1360" y="25" class="mono muted" font-size="12" text-anchor="end" letter-spacing="2">384x120</text>

  <rect x="24" y="56" width="1352" height="338" fill="#fffdf6" stroke="#1f1f1f" stroke-width="2"/>

  <rect x="24" y="56" width="1352" height="34" fill="#2a2825"/>
  <text x="42" y="78" class="mono" font-size="12" fill="#d8d4cb" letter-spacing="2">TERMINAL.ACNX</text>
  <circle cx="1328" cy="73" r="4" fill="#ea580c"/>

  <!-- Terminal dark panel -->
  <rect x="40" y="106" width="760" height="198" fill="#0f0f10" stroke="#1f1f1f"/>
  <text x="58" y="132" class="mono" font-size="21" fill="#f4f2eb">&gt; protocol detect: https://api.github.com</text>
  <text x="58" y="162" class="mono" font-size="21" fill="#f4f2eb">&gt; detected: HTTPS (port 443, TLS active)</text>
  <text x="58" y="192" class="mono" font-size="21" fill="#f4f2eb">&gt; circuit breaker: CLOSED (0/5 failures)</text>
  <text x="58" y="222" class="mono" font-size="21" fill="#f4f2eb">&gt; api call: GET /rate_limit → 200 (42ms)</text>
  <text x="58" y="252" class="mono" font-size="21" fill="#f4f2eb">&gt; soul updated: latency baseline 42ms</text>
  <text x="58" y="282" class="mono" font-size="21" fill="#ea580c">&gt; state: 123 tools / 18 protocols / vault sealed</text>

  <!-- Signal panel -->
  <rect x="818" y="106" width="542" height="198" fill="#fff8ea" stroke="#1f1f1f"/>
  <text x="836" y="132" class="mono muted" font-size="12" letter-spacing="2">CONNECT.SIGNAL</text>
  <line x1="836" y1="148" x2="1342" y2="148" stroke="#1f1f1f"/>
  <text x="836" y="178" class="mono ink" font-size="18">HTTP → SSH → gRPC → DB → SMTP</text>
  <text x="836" y="208" class="mono ink" font-size="18">Failure classify → Retry strategy</text>
  <text x="836" y="238" class="mono ink" font-size="18">Circuit breakers prevent cascades</text>
  <text x="836" y="268" class="mono ink" font-size="18">Souls track every remote system</text>
  <text x="836" y="298" class="mono accent" font-size="18">AES-256-GCM vault — credentials at rest</text>

  <!-- Bottom status -->
  <text x="40" y="330" class="mono muted" font-size="11" letter-spacing="1.6">SIGNAL: PROTOCOL OMNISCIENCE + ADAPTIVE AUTH + CONNECTION SOULS</text>
  <line x1="40" y1="342" x2="1352" y2="342" stroke="#1f1f1f"/>

  <text x="58" y="368" class="mono ink" font-size="15" letter-spacing="1">$ cargo test --workspace</text>
  <text x="58" y="388" class="mono accent" font-size="15" letter-spacing="1">test result: ok. 116 passed; 0 failed</text>
</svg>
