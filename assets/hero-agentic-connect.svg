<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-label="AgenticConnect hero pane in Agentra design system">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c9c6bb"/>
    </pattern>
    <style><![CDATA[
      .ink { fill:#121212; }
      .muted { fill:#6d6a63; }
      .accent { fill:#ea580c; }
      .mono { font-family:'IBM Plex Mono','JetBrains Mono',monospace; }
      .sans { font-family:'Sora','Space Grotesk',sans-serif; }
    ]]></style>
  </defs>

  <rect width="1400" height="360" fill="#f2f1ea"/>
  <rect width="1400" height="360" fill="url(#grid)"/>

  <line x1="28" y1="34" x2="1372" y2="34" stroke="#1f1f1f" stroke-width="1"/>
  <text x="28" y="26" class="mono muted" font-size="13" letter-spacing="2">// SECTION: CONNECT.SYSTEM</text>
  <text x="1338" y="26" class="mono muted" font-size="13" text-anchor="end" letter-spacing="2">TICK:0001</text>

  <!-- Protocol constellation panel -->
  <rect x="28" y="60" width="430" height="274" fill="#fffdf6" stroke="#1f1f1f" stroke-width="2"/>
  <rect x="28" y="60" width="430" height="32" fill="#2a2825"/>
  <text x="44" y="81" class="mono" font-size="12" fill="#d5d1c7" letter-spacing="2">RENDER: CONNECT.PROTOCOLS</text>
  <text x="442" y="81" class="mono accent" font-size="12" text-anchor="end" letter-spacing="2">LIVE</text>

  <!-- Dark protocol graph -->
  <rect x="44" y="108" width="398" height="194" fill="#0f0f10" stroke="#1f1f1f" stroke-width="1.5"/>

  <!-- Central hub -->
  <circle cx="243" cy="205" r="18" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
  <circle cx="243" cy="205" r="6" fill="#ea580c"/>

  <!-- Protocol nodes radiating out -->
  <line x1="243" y1="205" x2="160" y2="145" stroke="#2d2a26" stroke-width="1"/>
  <circle cx="160" cy="145" r="4" fill="#ea580c"/>
  <text x="137" y="140" class="mono" font-size="7" fill="#5f5a52">HTTP</text>

  <line x1="243" y1="205" x2="326" y2="145" stroke="#2d2a26" stroke-width="1"/>
  <circle cx="326" cy="145" r="4" fill="#ea580c"/>
  <text x="332" y="140" class="mono" font-size="7" fill="#5f5a52">SSH</text>

  <line x1="243" y1="205" x2="350" y2="205" stroke="#2d2a26" stroke-width="1"/>
  <circle cx="350" cy="205" r="4" fill="#ea580c"/>
  <text x="356" y="200" class="mono" font-size="7" fill="#5f5a52">gRPC</text>

  <line x1="243" y1="205" x2="326" y2="265" stroke="#2d2a26" stroke-width="1"/>
  <circle cx="326" cy="265" r="4" fill="#ea580c"/>
  <text x="332" y="270" class="mono" font-size="7" fill="#5f5a52">DB</text>

  <line x1="243" y1="205" x2="160" y2="265" stroke="#2d2a26" stroke-width="1"/>
  <circle cx="160" cy="265" r="4" fill="#ea580c"/>
  <text x="137" y="270" class="mono" font-size="7" fill="#5f5a52">SMTP</text>

  <line x1="243" y1="205" x2="136" y2="205" stroke="#2d2a26" stroke-width="1"/>
  <circle cx="136" cy="205" r="4" fill="#ea580c"/>
  <text x="107" y="200" class="mono" font-size="7" fill="#5f5a52">WS</text>

  <text x="44" y="325" class="mono" font-size="11" fill="#5f5a52" letter-spacing="1.6">SIGNAL: 18 PROTOCOLS + CIRCUIT BREAKERS + SOULS</text>

  <!-- Title section -->
  <line x1="480" y1="60" x2="480" y2="334" stroke="#1f1f1f" stroke-width="2"/>
  <text x="520" y="132" class="sans ink" font-size="66" font-weight="700" letter-spacing="1">UNIVERSAL</text>
  <text x="520" y="195" class="sans accent" font-size="66" font-weight="700" letter-spacing="1">CONNECTIVITY</text>

  <text x="520" y="238" class="mono muted" font-size="22">Protocol-agnostic external interface with</text>
  <text x="520" y="268" class="mono muted" font-size="22">adaptive retry, encrypted vault, and <tspan class="accent">123 MCP tools</tspan>.</text>

  <line x1="520" y1="292" x2="1308" y2="292" stroke="#1f1f1f" stroke-width="2"/>
  <text x="520" y="318" class="mono ink" font-size="12" letter-spacing="2">AGENTICCONNECT</text>
  <text x="860" y="318" class="mono ink" font-size="12" letter-spacing="2">24 INVENTIONS + 18 PROTOCOLS</text>
  <circle cx="1308" cy="314" r="5" fill="#ea580c"/>
</svg>
