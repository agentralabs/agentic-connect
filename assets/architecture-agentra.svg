<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="AgenticConnect architecture in Agentra Labs design system">
  <defs>
    <pattern id="dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#c8c5bb"/>
    </pattern>
    <style><![CDATA[
      .mono { font-family:'IBM Plex Mono','JetBrains Mono',monospace; }
      .ink { fill:#111111; }
      .muted { fill:#6f6a5f; }
      .accent { fill:#ea580c; }
      .panel { fill:#f2f1ea; stroke:#111111; stroke-width:2; }
      .card { fill:#fbfaf4; stroke:#111111; stroke-width:1.6; }
      .card-accent { fill:#f6ece4; stroke:#111111; stroke-width:1.6; }
      .card-dark { fill:#141414; stroke:#111111; stroke-width:1.6; }
      .wire-soft { stroke:#8f897e; stroke-width:1.2; }
      .wire-accent { stroke:#ea580c; stroke-width:1.8; }
    ]]></style>
  </defs>

  <rect width="1200" height="560" fill="#f2f1ea"/>
  <rect width="1200" height="560" fill="url(#dotgrid)"/>

  <line x1="26" y1="28" x2="1174" y2="28" stroke="#111111"/>
  <text x="30" y="20" class="mono muted" font-size="12" letter-spacing="2.2">// SECTION: AGENTICCONNECT.ARCH</text>
  <text x="1168" y="20" text-anchor="end" class="mono muted" font-size="12" letter-spacing="2">TICK:0001</text>

  <rect x="26" y="46" width="1148" height="492" class="panel"/>

  <text x="600" y="84" text-anchor="middle" class="mono ink" font-size="24" letter-spacing="3" font-weight="700">AGENTICCONNECT ARCHITECTURE</text>

  <!-- Client row -->
  <rect x="70" y="106" width="220" height="54" rx="10" class="card"/>
  <text x="180" y="139" text-anchor="middle" class="mono ink" font-size="16" font-weight="700">Claude / Cursor</text>

  <rect x="310" y="106" width="220" height="54" rx="10" class="card"/>
  <text x="420" y="139" text-anchor="middle" class="mono ink" font-size="16" font-weight="700">acnx CLI</text>

  <rect x="550" y="106" width="280" height="54" rx="10" class="card"/>
  <text x="690" y="139" text-anchor="middle" class="mono ink" font-size="16" font-weight="700">agentic-connect-mcp</text>

  <rect x="850" y="106" width="280" height="54" rx="10" class="card"/>
  <text x="990" y="139" text-anchor="middle" class="mono ink" font-size="16" font-weight="700">Rust API / C FFI</text>

  <!-- Wires down -->
  <line x1="180" y1="160" x2="180" y2="184" class="wire-soft"/>
  <line x1="420" y1="160" x2="420" y2="184" class="wire-soft"/>
  <line x1="690" y1="160" x2="690" y2="184" class="wire-soft"/>
  <line x1="990" y1="160" x2="990" y2="184" class="wire-soft"/>

  <!-- MCP surface -->
  <rect x="70" y="184" width="1060" height="36" rx="7" class="card-dark"/>
  <text x="600" y="207" text-anchor="middle" class="mono" fill="#f5f4ee" font-size="14" letter-spacing="2.2">MCP JSON-RPC STDIO — 123 TOOLS — 24 INVENTIONS</text>

  <!-- Tool dispatch -->
  <line x1="600" y1="220" x2="600" y2="240" class="wire-accent"/>

  <rect x="70" y="240" width="1060" height="30" rx="5" class="card-accent"/>
  <text x="600" y="260" text-anchor="middle" class="mono accent" font-size="12" letter-spacing="2">TOOL REGISTRY — DISPATCH + SCHEMA VALIDATION</text>

  <!-- Wires to tool groups -->
  <line x1="180" y1="270" x2="180" y2="295" class="wire-soft"/>
  <line x1="360" y1="270" x2="360" y2="295" class="wire-soft"/>
  <line x1="540" y1="270" x2="540" y2="295" class="wire-soft"/>
  <line x1="720" y1="270" x2="720" y2="295" class="wire-soft"/>
  <line x1="900" y1="270" x2="900" y2="295" class="wire-soft"/>

  <!-- Tool group cards -->
  <rect x="70" y="295" width="200" height="48" rx="8" class="card"/>
  <text x="170" y="315" text-anchor="middle" class="mono ink" font-size="11" font-weight="700">PROTOCOL + AUTH</text>
  <text x="170" y="333" text-anchor="middle" class="mono muted" font-size="9">detect · vault · retry</text>

  <rect x="290" y="295" width="140" height="48" rx="8" class="card"/>
  <text x="360" y="315" text-anchor="middle" class="mono ink" font-size="11" font-weight="700">API + GQL</text>
  <text x="360" y="333" text-anchor="middle" class="mono muted" font-size="9">call · discover</text>

  <rect x="450" y="295" width="180" height="48" rx="8" class="card"/>
  <text x="540" y="315" text-anchor="middle" class="mono ink" font-size="11" font-weight="700">DB + QUEUE</text>
  <text x="540" y="333" text-anchor="middle" class="mono muted" font-size="9">query · schema · publish</text>

  <rect x="650" y="295" width="140" height="48" rx="8" class="card"/>
  <text x="720" y="315" text-anchor="middle" class="mono ink" font-size="11" font-weight="700">SECURITY</text>
  <text x="720" y="333" text-anchor="middle" class="mono muted" font-size="9">tls · sentinel</text>

  <rect x="810" y="295" width="190" height="48" rx="8" class="card"/>
  <text x="905" y="315" text-anchor="middle" class="mono ink" font-size="11" font-weight="700">INTELLIGENCE</text>
  <text x="905" y="333" text-anchor="middle" class="mono muted" font-size="9">prophecy · evolve · dream</text>

  <!-- Wires to engines -->
  <line x1="300" y1="343" x2="300" y2="380" class="wire-soft"/>
  <line x1="500" y1="343" x2="500" y2="380" class="wire-soft"/>
  <line x1="700" y1="343" x2="700" y2="380" class="wire-soft"/>
  <line x1="900" y1="343" x2="900" y2="380" class="wire-soft"/>

  <!-- Engine row -->
  <text x="600" y="376" text-anchor="middle" class="mono muted" font-size="10" letter-spacing="3">ENGINE LAYER</text>

  <rect x="70" y="390" width="145" height="40" rx="6" class="card-dark"/>
  <text x="142" y="415" text-anchor="middle" class="mono" fill="#ea580c" font-size="10" font-weight="600">ConnectionStore</text>

  <rect x="230" y="390" width="125" height="40" rx="6" class="card-dark"/>
  <text x="292" y="415" text-anchor="middle" class="mono" fill="#ea580c" font-size="10" font-weight="600">RetryEngine</text>

  <rect x="370" y="390" width="130" height="40" rx="6" class="card-dark"/>
  <text x="435" y="415" text-anchor="middle" class="mono" fill="#ea580c" font-size="10" font-weight="600">CredentialVault</text>

  <rect x="515" y="390" width="110" height="40" rx="6" class="card-dark"/>
  <text x="570" y="415" text-anchor="middle" class="mono" fill="#ea580c" font-size="10" font-weight="600">HttpClient</text>

  <rect x="640" y="390" width="120" height="40" rx="6" class="card-dark"/>
  <text x="700" y="415" text-anchor="middle" class="mono" fill="#ea580c" font-size="10" font-weight="600">DbConnection</text>

  <rect x="775" y="390" width="100" height="40" rx="6" class="card-dark"/>
  <text x="825" y="415" text-anchor="middle" class="mono" fill="#ea580c" font-size="10" font-weight="600">TlsInspect</text>

  <rect x="890" y="390" width="120" height="40" rx="6" class="card-dark"/>
  <text x="950" y="415" text-anchor="middle" class="mono" fill="#ea580c" font-size="10" font-weight="600">WebhookEngine</text>

  <!-- Storage -->
  <line x1="142" y1="430" x2="142" y2="460" class="wire-accent"/>
  <rect x="70" y="460" width="1060" height="36" rx="7" class="card"/>
  <text x="600" y="483" text-anchor="middle" class="mono ink" font-size="13" letter-spacing="2">SQLITE — connections.db · profiles · health checks · credentials</text>

  <!-- Footer -->
  <line x1="70" y1="510" x2="1130" y2="510" stroke="#111111"/>
  <text x="70" y="528" class="mono ink" font-size="11" letter-spacing="1.2">agentic-connect (core)</text>
  <text x="400" y="528" class="mono ink" font-size="11" letter-spacing="1.2">agentic-connect-mcp (server)</text>
  <text x="750" y="528" class="mono ink" font-size="11" letter-spacing="1.2">agentic-connect-cli</text>
  <text x="1000" y="528" class="mono ink" font-size="11" letter-spacing="1.2">agentic-connect-ffi</text>
  <circle cx="1130" cy="524" r="4" class="accent"/>
</svg>
