<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-label="AgenticConnect terminal pane">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b8b6ae"/>
    </pattern>
  </defs>
  <rect width="1400" height="420" fill="#f2f1ea"/>
  <rect width="1400" height="420" fill="url(#grid)"/>
  <rect x="20" y="20" width="1360" height="380" fill="none" stroke="#111111" stroke-width="2"/>
  <line x1="20" y1="62" x2="1380" y2="62" stroke="#111111" stroke-width="2"/>
  <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5f5c53" letter-spacing="2"> // TERMINAL: QUICKSTART_PANE</text>
  <rect x="1318" y="36" width="8" height="8" fill="#ea580c"/>
  <text x="1336" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5f5c53" letter-spacing="2">002</text>

  <rect x="46" y="92" width="1308" height="280" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="46" y="92" width="1308" height="40" fill="#111111"/>
  <circle cx="68" cy="112" r="6" fill="#ef4444"/>
  <circle cx="90" cy="112" r="6" fill="#f59e0b"/>
  <circle cx="112" cy="112" r="6" fill="#22c55e"/>
  <text x="1180" y="117" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f2f1ea" letter-spacing="2">AGENTICCONNECT / MCP</text>

  <rect x="46" y="132" width="1308" height="240" fill="#080808"/>
  <text x="72" y="168" font-family="'JetBrains Mono', monospace" font-size="18" fill="#e5e5e5">&gt; curl -fsSL https://agentralabs.tech/install/connect | bash</text>
  <text x="72" y="202" font-family="'JetBrains Mono', monospace" font-size="18" fill="#e5e5e5">&gt; echo '{"method":"tools/call","params":{"name":"connect_protocol_detect"}}' | acnx-mcp</text>
  <text x="72" y="226" font-family="'JetBrains Mono', monospace" font-size="18" fill="#5f5c53">  Protocol: HTTPS  |  Port: 443  |  TLS: active  |  Latency: 42ms</text>
  <text x="72" y="260" font-family="'JetBrains Mono', monospace" font-size="18" fill="#e5e5e5">&gt; connect_api_call https://httpbin.org/get</text>
  <text x="72" y="284" font-family="'JetBrains Mono', monospace" font-size="18" fill="#5f5c53">  Status: 200  |  Latency: 142ms  |  Circuit: CLOSED  |  Soul: updated</text>
  <text x="72" y="318" font-family="'JetBrains Mono', monospace" font-size="18" fill="#e5e5e5">&gt; connect_retry_simulate --http-status 429</text>
  <text x="72" y="342" font-family="'JetBrains Mono', monospace" font-size="18" fill="#ea580c">  Class: RateLimit  |  Strategy: WaitRetryAfter  |  Max retries: 1</text>
  <text x="72" y="362" font-family="'JetBrains Mono', monospace" font-size="18" fill="#ea580c">_</text>
</svg>
