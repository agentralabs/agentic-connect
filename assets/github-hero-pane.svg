<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-label="AgenticConnect GitHub hero pane">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b8b6ae"/>
    </pattern>
  </defs>
  <rect width="1400" height="360" fill="#f2f1ea"/>
  <rect width="1400" height="360" fill="url(#grid)"/>
  <rect x="20" y="20" width="1360" height="320" fill="none" stroke="#111111" stroke-width="2"/>

  <line x1="20" y1="62" x2="1380" y2="62" stroke="#111111" stroke-width="2"/>
  <text x="40" y="48" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5f5c53" letter-spacing="2"> // AGENTRA_LABS: MODULE_HERO</text>
  <rect x="1318" y="36" width="8" height="8" fill="#ea580c"/>
  <text x="1336" y="48" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5f5c53" letter-spacing="2">001</text>

  <!-- Protocol constellation diagram -->
  <rect x="46" y="92" width="232" height="232" fill="none" stroke="#111111" stroke-width="2"/>
  <rect x="46" y="92" width="232" height="38" fill="#111111"/>
  <text x="62" y="116" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f2f1ea" letter-spacing="2">CONNECT.PROTOCOLS</text>

  <!-- Central hub -->
  <circle cx="162" cy="210" r="16" fill="none" stroke="#ea580c" stroke-width="2"/>
  <circle cx="162" cy="210" r="5" fill="#ea580c"/>

  <!-- Protocol nodes -->
  <rect x="82" y="148" width="42" height="20" fill="none" stroke="#111111" stroke-width="2" rx="2"/>
  <text x="88" y="162" font-family="'JetBrains Mono', monospace" font-size="8" fill="#111111">HTTP</text>

  <rect x="200" y="148" width="42" height="20" fill="none" stroke="#ea580c" stroke-width="2" rx="2"/>
  <text x="210" y="162" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ea580c">SSH</text>

  <rect x="222" y="200" width="42" height="20" fill="none" stroke="#111111" stroke-width="2" rx="2"/>
  <text x="228" y="214" font-family="'JetBrains Mono', monospace" font-size="8" fill="#111111">gRPC</text>

  <rect x="200" y="256" width="42" height="20" fill="none" stroke="#ea580c" stroke-width="2" rx="2"/>
  <text x="214" y="270" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ea580c">DB</text>

  <rect x="82" y="256" width="42" height="20" fill="none" stroke="#111111" stroke-width="2" rx="2"/>
  <text x="86" y="270" font-family="'JetBrains Mono', monospace" font-size="8" fill="#111111">SMTP</text>

  <rect x="60" y="200" width="42" height="20" fill="none" stroke="#111111" stroke-width="2" rx="2"/>
  <text x="72" y="214" font-family="'JetBrains Mono', monospace" font-size="8" fill="#111111">WS</text>

  <!-- Edges from hub to nodes -->
  <line x1="162" y1="194" x2="103" y2="168" stroke="#111111" stroke-width="2"/>
  <line x1="162" y1="194" x2="221" y2="168" stroke="#ea580c" stroke-width="2"/>
  <line x1="178" y1="210" x2="222" y2="210" stroke="#111111" stroke-width="2"/>
  <line x1="162" y1="226" x2="221" y2="256" stroke="#ea580c" stroke-width="2"/>
  <line x1="162" y1="226" x2="103" y2="256" stroke="#111111" stroke-width="2"/>
  <line x1="146" y1="210" x2="102" y2="210" stroke="#111111" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Title -->
  <text x="324" y="136" font-family="'JetBrains Mono', monospace" font-size="54" fill="#111111" font-weight="700" letter-spacing="1">AGENTICCONNECT</text>
  <text x="324" y="172" font-family="'JetBrains Mono', monospace" font-size="18" fill="#ea580c" font-weight="700" letter-spacing="2">UNIVERSAL EXTERNAL INTERFACE ENGINE</text>
  <text x="324" y="210" font-family="'JetBrains Mono', monospace" font-size="16" fill="#5f5c53">
    Protocol-agnostic connectivity with adaptive retry + encrypted vault.
  </text>
  <text x="324" y="234" font-family="'JetBrains Mono', monospace" font-size="16" fill="#5f5c53">
    18 protocols, 123 MCP tools. Connection Souls remember every system.
  </text>

  <!-- Stat boxes -->
  <rect x="324" y="258" width="154" height="34" fill="#111111"/>
  <text x="338" y="280" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ea580c" font-weight="700">18 PROTOCOLS</text>
  <rect x="494" y="258" width="154" height="34" fill="#111111"/>
  <text x="508" y="280" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ea580c" font-weight="700">123 MCP TOOLS</text>
  <rect x="664" y="258" width="154" height="34" fill="#111111"/>
  <text x="678" y="280" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ea580c" font-weight="700">8 AUTH METHODS</text>
  <rect x="834" y="258" width="190" height="34" fill="#111111"/>
  <text x="848" y="280" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f2f1ea" font-weight="700">CIRCUIT BREAKERS</text>

  <!-- Bottom status -->
  <text x="46" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5f5c53" letter-spacing="1">STATUS: OPERATIONAL</text>
  <rect x="200" y="330" width="8" height="8" fill="#22c55e"/>
  <text x="220" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5f5c53">PROTOCOLS: 18/18</text>
  <rect x="380" y="330" width="8" height="8" fill="#22c55e"/>
  <text x="400" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5f5c53">VAULT: SEALED</text>
  <rect x="530" y="330" width="8" height="8" fill="#22c55e"/>
  <text x="550" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5f5c53">RETRY: ARMED</text>
  <rect x="670" y="330" width="8" height="8" fill="#22c55e"/>
  <text x="690" y="340" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5f5c53">SOULS: TRACKING</text>
</svg>
